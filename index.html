<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 11 Computer Science - Master Revision Quiz</title>
    <style>
        :root {
            --primary: #701A75;
            --primary-light: #F3E8FF;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #059669;
            --error: #DC2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 0;
        }

        .progress-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--primary-light);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .option-btn.correct {
            background-color: #ECFDF5;
            border-color: var(--success);
            color: #065F46;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #FEF2F2;
            border-color: var(--error);
            color: #991B1B;
            font-weight: 600;
        }

        .feedback-box {
            background: var(--bg-color);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: opacity 0.2s;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .score-badge {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success);
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-screen">
            <div class="header">
                <h1>Year 11 Master Revision Quiz</h1>
                <div class="progress-indicator" id="progress">Question 1 of 30</div>
            </div>

            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
            
            <div class="feedback-box" id="feedback-box"></div>

            <div class="footer-nav">
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
            </div>
        </div>

        <div class="results-screen" id="results-screen">
            <h2>Quiz Completed! 🎉</h2>
            <p>Fantastic effort working through this rigorous Year 11 Computer Science master check.</p>
            <div class="score-badge" id="final-score">0 / 30</div>
            <p id="performance-comment">Review your notes and try again to cement your knowledge for the final exam.</p>
            <button class="restart-btn" onclick="restartQuiz()">Restart Master Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Which network topology requires the highest amount of dedicated physical cabling and hardware ports when fully implemented?",
                options: ["Star topology", "Bus topology", "Mesh topology", "Ring topology"],
                correct: 2,
                rationale: "A full mesh topology connects every single node directly to every other node, requiring an immense amount of cabling compared to star or bus layouts."
            },
            {
                q: "What is the key functional difference between a network switch and a traditional network hub?",
                options: [
                    "A hub uses IP addresses while a switch uses MAC addresses.",
                    "A switch sends data frames only to the specific destination port, whereas a hub broadcasts data to all ports.",
                    "A hub connects LANs to WANs while a switch only routes packets internally.",
                    "A switch is wireless while a hub requires copper cabling."
                ],
                correct: 1,
                rationale: "Intelligent switches maintain MAC address tables and forward data selectively, minimizing network congestion compared to hubs which blindly broadcast traffic everywhere."
            },
            {
                q: "Which protocol is specifically responsible for translating human-readable domain names (e.g., www.bbc.co.uk) into numerical IP addresses?",
                options: ["TCP", "DNS", "SMTP", "FTP"],
                correct: 1,
                rationale: "The Domain Name System (DNS) acts as the phone book of the internet, resolving text domain names into numeric IP routing addresses."
            },
            {
                q: "In packet switching, what specific piece of metadata ensures that reassembled packets appear in the correct sequence at the destination computer?",
                options: ["Source MAC address", "TTL (Time to Live)", "Sequence number", "Checksum validation bit"],
                correct: 2,
                rationale: "Sequence numbers allow the destination TCP layer to correctly reorder packets that may have arrived out of sequence due to taking different dynamic routes."
            },
            {
                q: "What is the primary structural vulnerability of a star topology network architecture?",
                options: [
                    "If any client cable breaks, the entire network shuts down.",
                    "If the central switch or hub fails, all connected client devices lose connection.",
                    "It cannot support wireless devices.",
                    "Data collisions increase exponentially with every new node."
                ],
                correct: 1,
                rationale: "The central switch represents a single point of failure in a star topology; if it goes down, every dependent node loses connectivity."
            },
            {
                q: "Which transmission medium provides the highest possible bandwidth and is entirely immune to electromagnetic interference (EMI)?",
                options: ["Cat6 Shielded Twisted Pair copper", "Coaxial cable", "Fibre optic cable", "Wi-Fi 6 radio waves"],
                correct: 2,
                rationale: "Fibre optic cables transmit data using pulses of light through glass cores, meaning they are completely unaffected by electrical or magnetic interference."
            },
            {
                q: "What fundamental characteristic distinguishes a Wide Area Network (WAN) from a Local Area Network (LAN)?",
                options: [
                    "WANs use wireless radio waves exclusively.",
                    "WANs span large geographical distances and typically lease telecommunication infrastructure.",
                    "LANs are owned exclusively by internet service providers.",
                    "WANs cannot use copper cabling."
                ],
                correct: 1,
                rationale: "WANs cover vast geographical regions (cities, countries, global) and rely on leased carrier infrastructure rather than private in-building wiring."
            },
            {
                q: "Which protocol is utilized to retrieve and synchronize incoming emails across multiple devices while keeping copies stored on the remote mail server?",
                options: ["SMTP", "FTP", "IMAP", "HTTP"],
                correct: 2,
                rationale: "Internet Message Access Protocol (IMAP) synchronizes mailboxes across devices by leaving master copies stored securely on the mail server."
            },
            {
                q: "What is the primary advantage of a client-server network architecture over a peer-to-peer (P2P) setup?",
                options: [
                    "Lower initial hardware setup costs",
                    "Centralized security management, backups, and user access control",
                    "Elimination of the need for network routers",
                    "Infinite scalability without bandwidth bottlenecks"
                ],
                correct: 1,
                rationale: "Client-server systems allow administrators to manage user accounts, permissions, and automated backups centrally from a secure server location."
            },
            {
                q: "Which networking hardware device operates at the network layer to route packets between distinct, separate networks using IP addresses?",
                options: ["Network Switch", "Wireless Access Point", "Router", "Network Interface Card"],
                correct: 2,
                rationale: "Routers connect separate networks (such as LANs to the WAN/Internet) by examining destination IP addresses and determining optimal paths."
            },
            {
                q: "What does a high network latency measurement indicate during data transmission?",
                options: [
                    "A massive volume of data transferred per second",
                    "A significant time delay for packets to travel from source to destination",
                    "A high contention ratio among users",
                    "Strong encryption standards applied to packets"
                ],
                correct: 1,
                rationale: "Latency measures the delay (in milliseconds) taken for a data packet to travel across the network from sender to receiver."
            },
            {
                q: "What is the core distinction between the Internet and the World Wide Web (WWW)?",
                options: [
                    "The Internet is wireless while the WWW is wired.",
                    "The Internet is the physical hardware infrastructure, whereas the WWW is a service running on top of it.",
                    "The WWW is older than the Internet.",
                    "There is no technical distinction; they are synonymous."
                ],
                correct: 1,
                rationale: "The Internet is the global physical network of interconnected hardware, while the WWW is the collection of web pages and services accessed via browsers."
            },
            {
                q: "Which protocol layer combination correctly describes TCP and IP functions respectively?",
                options: [
                    "TCP handles packet addressing; IP handles reassembly.",
                    "TCP ensures reliable ordered delivery and error checking; IP handles packet addressing and routing.",
                    "TCP encrypts web pages; IP translates domain names.",
                    "TCP controls wireless radio frequencies; IP routes emails."
                ],
                correct: 1,
                rationale: "IP is responsible for addressing and routing packets across networks, while TCP manages connection sessions, sequencing, and error recovery."
            },
            {
                q: "What does a Network Interface Card (NIC) utilize to uniquely identify a computing device on a local network?",
                options: ["An IPv4 address", "A Domain Name", "A 48-bit or 64-bit hardware MAC address", "A port number"],
                correct: 2,
                rationale: "Every NIC is assigned a globally unique physical MAC (Media Access Control) address during manufacturing."
            },
            {
                q: "Why is HTTPS considered significantly more secure than standard HTTP?",
                options: [
                    "It compresses files to make them smaller.",
                    "It encrypts data in transit using SSL/TLS protocols to prevent eavesdropping.",
                    "It bypasses routers entirely to avoid interception.",
                    "It requires users to log in with biometrics."
                ],
                correct: 1,
                rationale: "HTTPS wraps web traffic in an SSL/TLS cryptographic encryption layer so intercepted data packets cannot be read by malicious actors."
            },
            {
                q: "What is the output of the Boolean expression Q = (A AND B) OR (NOT A) when A = 0 and B = 1?",
                options: ["0", "1", "Undefined", "Depends on clock speed"],
                correct: 1,
                rationale: "When A = 0, NOT A = 1. Since it's an OR operation with 1 on one side, the entire expression evaluates to 1 regardless of (A AND B)."
            },
            {
                q: "Which logic gate outputs 1 exclusively when its inputs are different from one another?",
                options: ["AND gate", "OR gate", "XOR gate", "NOR gate"],
                correct: 2,
                rationale: "An Exclusive-OR (XOR) gate outputs 1 only when inputs differ (0,1 or 1,0), outputting 0 if both inputs match."
            },
            {
                q: "According to Boolean algebra laws, what is the simplification of the expression A OR 1?",
                options: ["0", "A", "NOT A", "1"],
                correct: 3,
                rationale: "Under the dominance (null) law, anything ORed with 1 always evaluates to 1 because at least one input is guaranteed true."
            },
            {
                q: "Why are NAND and NOR gates frequently referred to as 'universal gates'?",
                options: [
                    "They consume zero electrical power.",
                    "Any Boolean function or logic circuit can be constructed using only that single gate type.",
                    "They operate faster than all other gates.",
                    "They can process three inputs simultaneously."
                ],
                correct: 1,
                rationale: "Universal gates possess the functional completeness property, meaning any logical expression can be built entirely using only NAND or only NOR gates."
            },
            {
                q: "What is the simplified equivalent of the Boolean expression NOT(NOT A)?",
                options: ["0", "1", "A", "NOT A"],
                correct: 2,
                rationale: "Double negation cancels itself out: inverting a signal twice returns it to its original state (A)."
            },
            {
                q: "Which protocol is primarily used for uploading and downloading raw files between client computers and remote servers?",
                options: ["SMTP", "FTP", "IMAP", "DNS"],
                correct: 1,
                rationale: "File Transfer Protocol (FTP) is dedicated to transferring raw file directories between computers across a network."
            },
            {
                q: "In a wireless mesh network, what makes the architecture exceptionally reliable compared to a star topology?",
                options: [
                    "It relies on a central high-speed server.",
                    "Multiple interconnected pathways exist between nodes, preventing a single point of failure.",
                    "It operates without any power cables.",
                    "It blocks all external interference automatically."
                ],
                correct: 1,
                rationale: "Mesh networks feature redundant multi-path routing, meaning if one link or node fails, traffic dynamically reroutes through neighboring nodes."
            },
            {
                q: "What is the output of the Boolean expression Q = A AND (NOT A) for any input value of A?",
                options: ["0", "1", "A", "NOT A"],
                correct: 0,
                rationale: "According to the complement law, a variable ANDed with its own negation (A AND NOT A) is always 0 because both cannot be true simultaneously."
            },
            {
                q: "Which networking hardware device connects local area networks to wide area networks while filtering traffic via IP addresses?",
                options: ["Hub", "Switch", "Router", "Repeater"],
                correct: 2,
                rationale: "Routers connect LANs to WANs and inspect Layer 3 IP addresses to direct traffic."
            },
            {
                q: "What does a contention ratio of 50:1 mean in broadband internet service performance?",
                options: [
                    "50 users share the exact same dedicated fibre line simultaneously.",
                    "Up to 50 residential customers share the same core bandwidth capacity provided by the ISP.",
                    "Data is transmitted 50 times faster than normal broadband.",
                    "There are 50 routers between your computer and the server."
                ],
                correct: 1,
                rationale: "A 50:1 contention ratio means up to 50 users share the same pool of bandwidth, which can cause slowdowns during peak evening hours."
            },
            {
                q: "How many rows are required in a complete truth table for a Boolean expression featuring 3 distinct input variables (A, B, C)?",
                options: ["4", "6", "8", "16"],
                correct: 2,
                rationale: "The number of rows follows 2^n where n is the number of inputs. For 3 variables, 2^3 = 8 possible input combinations."
            },
            {
                q: "Which protocol is responsible for sending outgoing emails from an email client application to a mail server?",
                options: ["IMAP", "POP3", "SMTP", "HTTP"],
                correct: 2,
                rationale: "Simple Mail Transfer Protocol (SMTP) handles pushing and sending outgoing mail messages across servers."
            },
            {
                q: "What is the primary function of a Wireless Access Point (WAP) in a computer network?",
                options: [
                    "To assign dynamic IP addresses to client devices",
                    "To bridge wireless Wi-Fi devices onto a wired local area network infrastructure",
                    "To encrypt all web browser traffic",
                    "To amplify fibre optic light signals over long distances"
                ],
                correct: 1,
                rationale: "A WAP acts as a transceiver connecting wireless client devices directly into the physical wired Ethernet backbone of a LAN."
            },
            {
                q: "According to the idempotent law in Boolean algebra, what does the expression A AND A simplify to?",
                options: ["0", "1", "A", "NOT A"],
                correct: 2,
                rationale: "The idempotent law states that operating a variable with itself yields the variable itself (A AND A = A and A OR A = A)."
            },
            {
                q: "Which factor is least likely to directly impact wireless network performance in a school building?",
                options: [
                    "Thick concrete load-bearing walls",
                    "Overlapping Wi-Fi channels from nearby classrooms",
                    "The brand and color of the computer monitor connected to student workstations",
                    "Microwave ovens and electronic appliances operating nearby"
                ],
                correct: 2,
                rationale: "Peripheral hardware like monitor brands have zero impact on Wi-Fi radio transmission, whereas walls, channel congestion, and interference directly degrade wireless signals."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const progressIndicator = document.getElementById("progress");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizScreen = document.getElementById("quiz-screen");
        const resultsScreen = document.getElementById("results-screen");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.style.display = "none";
            nextBtn.style.display = "none";
            
            const qData = questions[currentQuestion];
            progressIndicator.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.textContent = qData.q;
            
            optionsContainer.innerHTML = "";
            qData.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const qData = questions[currentQuestion];
            const buttons = optionsContainer.getElementsByTagName("button");

            if (selectedIndex === qData.correct) {
                buttons[selectedIndex].classList.add("correct");
                score++;
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${qData.rationale}`;
            } else {
                buttons[selectedIndex].classList.add("incorrect");
                buttons[qData.correct].classList.add("correct");
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${qData.rationale}`;
            }

            feedbackBox.style.display = "block";
            
            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (currentQuestion < questions.length - 1) {
                nextBtn.textContent = "Next Question ➔";
            } else {
                nextBtn.textContent = "View Results ➔";
            }
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.style.display = "none";
            resultsScreen.style.display = "block";
            finalScore.textContent = `${score} / ${questions.length}`;
            
            const comment = document.getElementById("performance-comment");
            const percentage = (score / questions.length) * 100;
            if (percentage >= 85) {
                comment.textContent = "Outstanding mastery! You are fully prepared for your Year 11 Computer Science exams.";
            } else if (percentage >= 60) {
                comment.textContent = "Solid understanding! Review your weaker topics (like protocols or Boolean laws) to aim for top marks.";
            } else {
                comment.textContent = "Keep revising! Re-read your OneNote revision notes carefully and try the quiz again.";
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            resultsScreen.style.display = "none";
            quizScreen.style.display = "block";
            loadQuestion();
        }

        // Safely initialize when the page finishes loading
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
