<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 11 Computer Science - Master Revision Quiz</title>
    <style>
        :root {
            --primary: #701A75;
            --primary-light: #F3E8FF;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #059669;
            --error: #DC2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 0;
        }

        .progress-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--primary-light);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .option-btn.correct {
            background-color: #ECFDF5;
            border-color: var(--success);
            color: #065F46;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #FEF2F2;
            border-color: var(--error);
            color: #991B1B;
            font-weight: 600;
        }

        .feedback-box {
            background: var(--bg-color);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: opacity 0.2s;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .score-badge {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success);
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-screen">
            <div class="header">
                <h1>Year 11 Master Revision Quiz</h1>
                <div class="progress-indicator" id="progress">Question 1 of 30</div>
            </div>

            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
            
            <div class="feedback-box" id="feedback-box"></div>

            <div class="footer-nav">
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
            </div>
        </div>

        <div class="results-screen" id="results-screen">
            <h2>Quiz Completed! 🎉</h2>
            <p>Fantastic effort working through this rigorous Year 11 Computer Science master check.</p>
            <div class="score-badge" id="final-score">0 / 30</div>
            <p id="performance-comment">Review your notes and try again to cement your knowledge for the final exam.</p>
            <button class="restart-btn" onclick="restartQuiz()">Restart Master Quiz</button>
        </div>
    </div>
